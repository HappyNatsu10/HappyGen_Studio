name: Build Mobile Apps (Android & iOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Install Dependencies
        run: pnpm install

      - name: Ensure Firebase Config Exists for Build
        run: |
          mkdir -p src/config
          if [ -n "${{ secrets.FIREBASE_CONFIG_JS }}" ]; then
            echo "${{ secrets.FIREBASE_CONFIG_JS }}" > src/config/firebase.js
          elif [ ! -f src/config/firebase.js ]; then
            cat << 'EOF' > src/config/firebase.js
import { initializeApp } from "firebase/app";
import { getAuth } from "firebase/auth";
import { getFirestore } from "firebase/firestore";

const firebaseConfig = {
  apiKey: "AIzaSyBGzEqu4lGVCqpot47iG5rTRo6eYkVE9dQ",
  authDomain: "happygen-studio.firebaseapp.com",
  projectId: "happygen-studio",
  storageBucket: "happygen-studio.firebasestorage.app",
  messagingSenderId: "619040765912",
  appId: "1:619040765912:web:d7d6394096afa09ff9e4ad",
  measurementId: "G-VCYV2HRFT1"
};

let app = null;
let auth = null;
let db = null;

try {
  app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getFirestore(app);
} catch (e) {
  console.warn("Firebase initialization notice:", e);
}

export { auth, db };
export default app;
EOF
          fi

      - name: Build Web App
        run: pnpm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: happygen-studio-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    name: Build iOS App
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Install Dependencies
        run: pnpm install

      - name: Ensure Firebase Config Exists for Build
        run: |
          mkdir -p src/config
          if [ -n "${{ secrets.FIREBASE_CONFIG_JS }}" ]; then
            echo "${{ secrets.FIREBASE_CONFIG_JS }}" > src/config/firebase.js
          elif [ ! -f src/config/firebase.js ]; then
            cat << 'EOF' > src/config/firebase.js
import { initializeApp } from "firebase/app";
import { getAuth } from "firebase/auth";
import { getFirestore } from "firebase/firestore";

const firebaseConfig = {
  apiKey: "AIzaSyBGzEqu4lGVCqpot47iG5rTRo6eYkVE9dQ",
  authDomain: "happygen-studio.firebaseapp.com",
  projectId: "happygen-studio",
  storageBucket: "happygen-studio.firebasestorage.app",
  messagingSenderId: "619040765912",
  appId: "1:619040765912:web:d7d6394096afa09ff9e4ad",
  measurementId: "G-VCYV2HRFT1"
};

let app = null;
let auth = null;
let db = null;

try {
  app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getFirestore(app);
} catch (e) {
  console.warn("Firebase initialization notice:", e);
}

export { auth, db };
export default app;
EOF
          fi

      - name: Build Web App
        run: pnpm run build

      - name: Sync Capacitor iOS & CocoaPods
        run: |
          npx cap sync ios
          cd ios/App
          pod install

      - name: Build iOS App with Xcode
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package App as Payload / Zip
        run: |
          mkdir -p Payload
          cp -r ios/App/build/Build/Products/Debug-iphoneos/App.app Payload/
          zip -r HappyGenStudio-iOS-unsigned.ipa Payload
          zip -r HappyGenStudio-iOS-App.zip ios/App/build/Build/Products/Debug-iphoneos/App.app

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: happygen-studio-ios
          path: |
            HappyGenStudio-iOS-unsigned.ipa
            HappyGenStudio-iOS-App.zip
