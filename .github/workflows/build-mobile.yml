name: Build & Release HappyGen Studio (All Platforms)

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Choose which platform to build'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'ios'
          - 'android'
      publish_release:
        description: 'Publish builds as a GitHub Release?'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Release Tag (e.g. v2.0.0) if publishing'
        required: false
        default: 'v2.0.0'
        type: string

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    if: ${{ github.event_name == 'push' || github.event.inputs.build_target == 'android' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Install Dependencies
        run: pnpm install

      - name: Build Web App
        run: pnpm run build

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../HappyGenStudio-Android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: happygen-studio-android
          path: HappyGenStudio-Android.apk

  build-ios:
    name: Build iOS App
    if: ${{ github.event_name == 'push' || github.event.inputs.build_target == 'ios' || github.event.inputs.build_target == 'both' || github.event.inputs.build_target == '' }}
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Install Dependencies
        run: pnpm install

      - name: Build Web App
        run: pnpm run build

      - name: Sync Capacitor iOS & CocoaPods
        run: |
          npx cap sync ios
          cd ios/App
          pod install

      - name: Build iOS App with Xcode
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package App as Payload / Zip
        run: |
          mkdir -p Payload
          cp -r ios/App/build/Build/Products/Debug-iphoneos/App.app Payload/
          zip -r HappyGenStudio-iOS.ipa Payload
          zip -r HappyGenStudio-iOS-App.zip ios/App/build/Build/Products/Debug-iphoneos/App.app

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: happygen-studio-ios
          path: |
            HappyGenStudio-iOS.ipa
            HappyGenStudio-iOS-App.zip

  build-macos:
    name: Build macOS Desktop (DMG)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Install Dependencies
        run: pnpm install

      - name: Build Web App
        run: pnpm run build

      - name: Package macOS App
        run: pnpm exec electron-builder --mac dmg zip --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: happygen-studio-macos
          path: |
            release/*.dmg
            release/*-mac.zip

  build-windows:
    name: Build Windows Desktop (EXE)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Install Dependencies
        run: pnpm install

      - name: Build Web App
        run: pnpm run build

      - name: Package Windows App
        run: pnpm exec electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: happygen-studio-windows
          path: release/*.exe

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-ios, build-macos, build-windows]
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Determine Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: HappyGen Studio ${{ steps.vars.outputs.tag }}
          body: |
            ## HappyGen Studio — ${{ steps.vars.outputs.tag }}

            ### 📱 Android
            - Download **`HappyGenStudio-Android.apk`** and tap to install directly on your device.

            ### 🍎 iPad & iPhone (iOS)
            - Download **`HappyGenStudio-iOS.ipa`**.
            - **Option 1 (Direct On-Device):** Open the `.ipa` in **SideStore** or **Scarlet** to install directly without a computer.
            - **Option 2 (Mac/PC):** Drag & drop the `.ipa` into **Sideloadly** or **AltStore**.
            - **Option 3 (No install needed):** Open the web app in Safari and tap **Share > Add to Home Screen**.

            ### 🖥️ macOS
            - Download the **`.dmg`** file, open it, and drag **HappyGen Studio** to your Applications folder.

            ### 🪟 Windows
            - Download the **`.exe`** installer and run it.
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            downloaded-artifacts/**/*.apk
            downloaded-artifacts/**/*.exe
            downloaded-artifacts/**/*.dmg
            downloaded-artifacts/**/*.ipa
            downloaded-artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
